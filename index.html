
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TVETA - نظام إدارة جودة التدريب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#1e3a8a', // Dark Blue
                light: '#2563eb',
                dark: '#172554',
              },
              secondary: {
                DEFAULT: '#b45309', // Bronze
                light: '#d97706',
              },
              accent: '#f59e0b',
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px rgba(30, 58, 138, 0.3)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #0f172a; /* Dark background initially to match login theme */
        color: #1e293b;
        margin: 0;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
        transition: background 0.3s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* Animation Utilities */
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }

      /* Print Styles */
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background-color: white;
          color: black;
        }
        .print-only {
          display: block !important;
        }
        table, tr, td, th {
          page-break-inside: avoid;
        }
        /* Restore flex for print headers hidden by default */
        .print\:flex {
          display: flex !important;
        }
      }
    </style>

  <body>
    <div id="root">
      <!-- Immediate Loading State: Visible before React loads -->

        <div style="width:50px;height:50px;border:4px solid rgba(59,130,246,0.3);border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite"></div>
        <div style="text-align:center">
           <h1 style="font-size:2rem;font-weight:900;color:#f8fafc;margin-bottom:0.2rem;letter-spacing:-1px">TVETA</h1>
           <p style="font-size:0.875rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:2px">Quality System</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
